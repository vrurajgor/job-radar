name: Daily job radar

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Discover job feeds (first run only)
        if: hashFiles('data/sources.json') == ''
        run: python -m radar.discover

      - name: Fetch postings and build dashboard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m radar.run --scheduled
          else
            python -m radar.run
          fi

      - name: Save results
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Job radar: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push
