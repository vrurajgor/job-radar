name: Discover job feeds

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which companies to scan (1 = healthcare only, faster; all = everyone)"
        default: "all"
        type: choice
        options: ["all", "1", "2"]
  push:
    paths:
      - sources_manual.csv
      - companies.csv

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find each company's job feed
        run: |
          TIER="${{ github.event.inputs.tier || 'all' }}"
          if [ "$TIER" = "all" ]; then python -m radar.discover; else python -m radar.discover --tier "$TIER"; fi
      - name: Save sources
        run: |
          git config user.name  "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/sources.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Job radar: refresh job feeds"
          git push
